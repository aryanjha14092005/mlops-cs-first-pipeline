# GitHub automatically looks for workflow files inside .github/workflows
name: Iris ML API - CI Pipeline

on:
  # Run CI whenever code is pushed to the main branch
  push:
    branches:
      - main

  # Also validate proposed changes before merging to main branch
  pull_request:
    branches:
      - main

# Permissions are restricted to repository content only
permissions:
  contents: read

# Define the jobs that make up the pipeline
jobs:
  # Define the job name
  test-and-build:
    # Define the type of runner to run the job on
    runs-on: ubuntu-latest

    # Define the steps to be executed as part of the job
    steps:
      # Step 1: download the repo content to the runner
      - name: Checkout code repository
        uses: actions/checkout@v4

      # Step 2: setup Python environment
      - name: Install Python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      #step 3: install dependencies
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      #step 4: execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v
        #step 5: build the docker image
      - name: Build docker image
        run: docker build -t iris-ml-api:@{{github.sha}} .
        
